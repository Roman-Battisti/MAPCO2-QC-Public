  - time
  fill_value: -9999
isolated_power:
  attributes:
    long_name: Isolated Power
    units: volts
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
ph_ext:
  attributes:
    ancillary_variables: ph_ext_qc
    long_name: FET EXT calculated pH in total scale
    units: "1"
    valid_range:
    - 7.5
    - 8.9
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
ph_ext_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: >-
      quality_good missing_data out_of_range spike_detected
      manually_flagged
    long_name: ph_ext Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
ph_int:
  attributes:
    ancillary_variables: ph_int_qc
    long_name: FET INT calculated pH in total scale
    units: "1"
    valid_range:
    - 7.5
    - 8.9
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
ph_int_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: >-
      quality_good missing_data out_of_range spike_detected
      manually_flagged
    long_name: ph_int Quality
