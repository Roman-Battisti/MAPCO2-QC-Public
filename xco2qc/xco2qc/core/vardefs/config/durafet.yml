  fill_value: -9999
controller_temp:
  attributes:
    long_name: Controller Temp (22C at room temp)
    units: degrees_celsius
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
durafet_time:
  attributes:
    axis: T
    calendar: proleptic_gregorian
    long_name: Durafet Time
    standard_name: time
    units: seconds since 1970-01-01T00:00:00
  datatype: i8
  dimensions:
  - time
  fill_value: -9999
fet_ext:
  attributes:
    long_name: V FET EXT
    units: volts
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
fet_int:
