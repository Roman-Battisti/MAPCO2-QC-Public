external_flag:
  attributes:
    long_name: External Flag
  datatype: i2
  dimensions:
  - time
  fill_value: -9999
ph:
  attributes:
    ancillary_variables: ph_qc ph_err
    long_name: pH
    units: "1"
    valid_range:
    - 7.5
    - 8.9
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
ph_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    - 256
    - 512
    - 1024
    - 2048
    - 4096
    flag_meanings: >-
      quality_good missing_data out_of_range spike_detected
      manually_flagged bad_SSTc external_sami_outlier external_sami_pump
      external_sami_saturation external_sami_blank
    long_name: ph Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
ph_err:
  attributes:
    long_name: pH Error
    valid_range:
    - 7.5
    - 8.9
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
SSS:
  attributes:
    long_name: Salinity
    standard_name: sea_surface_SSS
    units: 1e-3
    valid_range:
    - 0.0001
    - 42
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
temperature:
  attributes:
    long_name: Temperature
    units: degrees_celsius
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
time:
  attributes:
    axis: T
    calendar: proleptic_gregorian
    long_name: Time
    standard_name: time
    units: seconds since 1970-01-01T00:00:00
  datatype: i8
  dimensions:
  - time
  fill_value: -9999
