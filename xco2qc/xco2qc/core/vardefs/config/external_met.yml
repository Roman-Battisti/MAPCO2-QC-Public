SSS:
  attributes:
    long_name: Salinity
    standard_name: sea_surface_SSS
    units: 1e-3
    valid_range:
    - 0
    - 42
    source: external met
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
SST:
  attributes:
    long_name: Sea Surface Temperature
    standard_name: sea_surface_temperature
    units: degrees_celsius
    valid_range:
    - -2.5
    - 40
    source: external met
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
time:
  attributes:
    axis: T
    calendar: proleptic_gregorian
    long_name: Time
    standard_name: time
    units: seconds since 1970-01-01T00:00:00
  datatype: i8
  fill_value: -9999
