    ancillary_variables: span_coefficient_qc
    long_name: Licor Span Coefficient
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
span_coefficient_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    - 512
    flag_meanings: >-
      quality_good missing_data out_of_range spike_detected
      manually_flagged bad_temperature
