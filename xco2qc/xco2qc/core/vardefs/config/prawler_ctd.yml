conductivity:
  attributes:
    ancillary_variables: conductivity_qc
    long_name: Conductivity
    standard_name: sea_water_electrical_conductivity
    units: S m-1
    valid_range:
    - 1.5
    - 6.0
  datatype: f8
  fill_value: -9999
conductivity_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: quality_good missing_data out_of_range spike_detected
      manually_flagged 
    long_name: conductivity Quality
    standard_name: status_flag
  datatype: I4
  fill_value: 4294967295
pressure:
  attributes:
    ancillary_variables: pressure_qc
    long_name: Pressure
    standard_name: sea_water_pressure
    units: kPa
  datatype: f8
  fill_value: -9999
pressure_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: quality_good missing_data out_of_range spike_detected
      manually_flagged 
    long_name: pressure Quality
    standard_name: status_flag
  datatype: I4
  fill_value: 4294967295
temperature:
  attributes:
    ancillary_variables: temperature_qc
    long_name: Temperature
    units: degrees_celsius
    valid_range:
    - -2.5
    - 40
    source: prawler
  datatype: f8
  fill_value: -9999
