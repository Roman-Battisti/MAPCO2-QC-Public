battery:
  attributes:
    long_name: Battery
    units: volts
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
external_flag:
  attributes:
    long_name: Flag
  datatype: I2
  dimensions:
  - time
  fill_value: 65535
ph:
  attributes:
    ancillary_variables: ph_qc
    standard_name: sea_water_ph_reported_on_total_scale
    long_name: pH
    units: "1"
    valid_range:
    - 7.5
    - 8.9
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
ph_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    - 256
    - 8192
    - 16384
    flag_meanings: >-
      quality_good missing_data out_of_range spike_detected 
      manually_flagged bad_SSTc invalid_434_578_measurement
      too_few_measurements
    long_name: ph Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
r2:
  attributes:
    long_name: R**2 of pH linear regression
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
SSS:
  attributes:
    ancillary_variables: SSS_qc
    long_name: Salinity
    standard_name: sea_surface_SSS
    units: 1e-3
    valid_range:
    - 0.0001
    - 42
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
SSS_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: quality_good missing_data out_of_range spike_detected
      manually_flagged 
    long_name: SSS Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
sami_time:
  attributes:
    axis: T
    calendar: proleptic_gregorian
    comment: timestamp from SAMI cycle
    long_name: Time
    standard_name: time
    units: seconds since 1970-01-01T00:00:00
  datatype: i8
  dimensions:
  - time
  fill_value: -9999
slope:
  attributes:
    long_name: slope of pH linear regression
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
temperature:
  attributes:
    ancillary_variables: temperature_qc
    long_name: Temperature
    units: degrees_Celsius
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
temperature_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: quality_good missing_data out_of_range spike_detected
      manually_flagged 
    long_name: temperature Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
time:
  attributes:
    axis: T
    calendar: proleptic_gregorian
    comment: timestamp from MAPCO2 cycle header
    long_name: Time
    standard_name: time
    units: seconds since 1970-01-01T00:00:00
  datatype: i8
  dimensions:
  - time
  fill_value: -9999
