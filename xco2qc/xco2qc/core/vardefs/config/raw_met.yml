sstc:
  attributes:
    long_name: SSTC Samples
  datatype: f8
  dimensions:
  - time
  - sstc_max_sample_size
  - num_sstc_params
  fill_value: -9999
time:
  attributes:
    axis: T
    calendar: proleptic_gregorian
    long_name: Time
    standard_name: time
    units: seconds since 1970-01-01T00:00:00
  datatype: i8
  fill_value: -9999
wind:
  attributes:
    long_name: Wind Samples
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
