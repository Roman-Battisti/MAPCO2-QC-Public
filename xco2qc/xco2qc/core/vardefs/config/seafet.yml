  datatype: f8
  dimensions:
  - time
  fill_value: -9999
SSS:
  attributes:
    ancillary_variables: SSS_qc
    long_name: Salinity
    standard_name: sea_surface_SSS
    units: 1e-3
    valid_range:
    - 0.0001
    - 42
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
SSS_qc:
