ph:
  attributes:
    long_name: FET EXT Calculated pH in Total Scale
    ancillary_variables: ph_qc
    standard_name: sea_water_ph_reported_on_total_scale
    units: "1"
    valid_range:
    - 7.5
    - 8.9
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
ph_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    - 256
    - 8192
    - 16384
    flag_meanings: >-
      quality_good missing_data out_of_range spike_detected 
      manually_flagged bad_SSTc invalid_434_578_measurement
      too_few_measurements
    long_name: ph Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
ph_int:
  attributes:
    long_name: FET INT Calculated pH in Total Scale
    valid_range:
    - 7.5
    - 8.9
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
s_ctd:
  attributes:
