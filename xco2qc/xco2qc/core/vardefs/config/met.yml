conductivity:
  attributes:
    ancillary_variables: conductivity_qc
    long_name: Conductivity
    standard_name: sea_water_electrical_conductivity
    units: S m-1
    valid_range:
    - 1.5
    - 6.0
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
conductivity_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: quality_good missing_data out_of_range spike_detected 
      manually_flagged 
    long_name: conductivity Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
SSS:
  attributes:
    ancillary_variables: SSS_qc
    long_name: Salinity
    standard_name: sea_surface_SSS
    units: 1e-3
    valid_range:
    - 0.0001
    - 42
    source: met
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
SSS_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: quality_good missing_data out_of_range spike_detected
      manually_flagged 
    long_name: SSS Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
SST:
  attributes:
    ancillary_variables: SST_qc
    long_name: Sea Surface Temperature
    standard_name: sea_surface_temperature
    units: degrees_celsius
    valid_range:
    - -2.5
    - 40
    source: met
  datatype: f8
  dimensions:
  - time
  fill_value: -9999
SST_qc:
  attributes:
    flag_masks:
    - 1
    - 2
    - 4
    - 8
    - 64
    flag_meanings: quality_good missing_data out_of_range spike_detected
      manually_flagged 
    long_name: SST Quality
    standard_name: status_flag
  datatype: I4
  dimensions:
  - time
  fill_value: 4294967295
time:
  attributes:
    axis: T
    calendar: proleptic_gregorian
    long_name: Time
    standard_name: time
    units: seconds since 1970-01-01T00:00:00
  datatype: i8
  dimensions:
  - time
  fill_value: -9999
